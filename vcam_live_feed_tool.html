
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.container { padding: 1rem 0; display: flex; flex-direction: column; gap: 16px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; }
.card-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
.preview { width: 100%; aspect-ratio: 16/9; background: #0a0a0a; border-radius: var(--border-radius-md); overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
video { width: 100%; height: 100%; object-fit: cover; }
canvas { width: 100%; height: 100%; }
.overlay-badge { position: absolute; top: 8px; left: 8px; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
.badge-live { background: #e24b4a; color: #fff; }
.badge-vcam { background: #534AB7; color: #fff; }
.badge-rec { background: #e24b4a; color: #fff; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 6px 14px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); cursor: pointer; background: var(--color-background-primary); color: var(--color-text-primary); }
.btn:hover { background: var(--color-background-secondary); }
.btn.active { background: #534AB7; color: #fff; border-color: #534AB7; }
.btn.danger { background: #e24b4a; color: #fff; border-color: #e24b4a; }
.slider-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.slider-row label { font-size: 12px; color: var(--color-text-secondary); min-width: 60px; }
.slider-row input[type=range] { flex: 1; }
.slider-row span { font-size: 12px; min-width: 32px; text-align: right; color: var(--color-text-secondary); }
.status-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-border-tertiary); }
.status-dot.green { background: #639922; }
.status-dot.red { background: #e24b4a; }
.status-text { font-size: 12px; color: var(--color-text-secondary); }
#download-link { display: none; }
.full-preview { width: 100%; aspect-ratio: 16/9; background: #0a0a0a; border-radius: var(--border-radius-md); overflow: hidden; position: relative; }
#composite-canvas { width: 100%; height: 100%; }
</style>

<div class="container">
  <h2 class="sr-only">Virtual camera and live feed recording tool</h2>

  <div class="row">
    <div class="card">
      <div class="card-label">Camera feed — phone</div>
      <div class="preview">
        <video id="cam-video" autoplay playsinline muted></video>
        <span class="overlay-badge badge-live" id="cam-badge">NO CAM</span>
      </div>
      <div class="controls" style="margin-top:10px;">
        <button class="btn" id="start-cam">start camera</button>
        <button class="btn" id="flip-cam" style="display:none;">flip</button>
      </div>
      <div class="status-row" style="margin-top:8px;">
        <div class="status-dot" id="cam-dot"></div>
        <span class="status-text" id="cam-status">camera off</span>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Virtual camera — 3D scene</div>
      <div class="preview">
        <canvas id="vcam-canvas"></canvas>
        <span class="overlay-badge badge-vcam">VCAM</span>
      </div>
      <div class="controls" style="margin-top:10px;">
        <button class="btn active" id="scene-grid">grid</button>
        <button class="btn" id="scene-tunnel">tunnel</button>
        <button class="btn" id="scene-particles">particles</button>
      </div>
      <div class="slider-row">
        <label>speed</label>
        <input type="range" id="vcam-speed" min="1" max="10" value="4" step="1">
        <span id="speed-val">4</span>
      </div>
      <div class="slider-row">
        <label>depth</label>
        <input type="range" id="vcam-depth" min="1" max="10" value="5" step="1">
        <span id="depth-val">5</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">composite output — cam + virtual bg</div>
    <div class="full-preview">
      <canvas id="composite-canvas"></canvas>
      <span class="overlay-badge" id="rec-badge" style="display:none; background:#e24b4a; color:#fff; position:absolute; top:8px; left:8px; font-size:11px; padding:2px 8px; border-radius:4px; font-weight:500;">● REC</span>
    </div>
    <div class="controls" style="margin-top:10px;">
      <button class="btn" id="blend-side">side by side</button>
      <button class="btn active" id="blend-overlay">cam overlay</button>
      <button class="btn" id="blend-pip">picture in picture</button>
    </div>
    <div class="slider-row">
      <label>cam opacity</label>
      <input type="range" id="cam-opacity" min="10" max="100" value="85" step="1">
      <span id="opacity-val">85%</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">record</div>
    <div class="controls">
      <button class="btn" id="rec-btn">● start recording</button>
      <button class="btn" id="stop-btn" disabled>■ stop</button>
      <a id="download-link">download</a>
    </div>
    <div class="status-row" style="margin-top:10px;">
      <div class="status-dot" id="rec-dot"></div>
      <span class="status-text" id="rec-status">not recording</span>
      <span class="status-text" id="rec-time" style="margin-left:auto;"></span>
    </div>
  </div>
</div>

<script>
let camStream = null;
let facingMode = 'environment';
let vcamScene = 'grid';
let blendMode = 'overlay';
let vcamSpeed = 4;
let vcamDepth = 5;
let camOpacity = 0.85;
let animFrame;
let t = 0;
let mediaRecorder = null;
let recordedChunks = [];
let recInterval = null;
let recSeconds = 0;
let isRecording = false;

const camVideo = document.getElementById('cam-video');
const vcamCanvas = document.getElementById('vcam-canvas');
const compositeCanvas = document.getElementById('composite-canvas');
const vcCtx = vcamCanvas.getContext('2d');
const compCtx = compositeCanvas.getContext('2d');

vcamCanvas.width = 640; vcamCanvas.height = 360;
compositeCanvas.width = 640; compositeCanvas.height = 360;

function drawGrid(ctx, w, h, time) {
  ctx.fillStyle = '#080818';
  ctx.fillRect(0, 0, w, h);
  const lines = 12;
  const depth = vcamDepth * 0.1;
  const spd = vcamSpeed * 0.003;
  const tz = (time * spd) % 1;
  ctx.strokeStyle = '#534AB7';
  ctx.lineWidth = 0.8;
  for (let i = 0; i <= lines; i++) {
    const x = (i / lines) * w;
    const vx = (x - w/2) * (1 + depth * tz) + w/2;
    ctx.globalAlpha = 0.3 + tz * 0.4;
    ctx.beginPath(); ctx.moveTo(w/2, h/2); ctx.lineTo(vx, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w/2, h/2); ctx.lineTo(vx, 0); ctx.stroke();
  }
  for (let j = 0; j <= 8; j++) {
    const pz = ((j / 8) + tz) % 1;
    const scale = 0.05 + pz * 0.95;
    const y = h/2 + (pz - 0.5) * h * 0.9;
    ctx.globalAlpha = pz * 0.6;
    ctx.beginPath();
    ctx.moveTo(w/2 - scale*w*0.5, y);
    ctx.lineTo(w/2 + scale*w*0.5, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawTunnel(ctx, w, h, time) {
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, w, h);
  const rings = 10;
  const spd = vcamSpeed * 0.004;
  const tz = (time * spd) % 1;
  for (let i = rings; i >= 0; i--) {
    const pz = ((i / rings) + tz) % 1;
    const r = pz * w * 0.55;
    ctx.globalAlpha = 0.15 + pz * 0.5;
    ctx.strokeStyle = pz > 0.5 ? '#5DCAA5' : '#534AB7';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.rect(w/2 - r, h/2 - r*(h/w), r*2, r*2*(h/w));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParticles(ctx, w, h, time) {
  ctx.fillStyle = 'rgba(5,5,20,0.2)';
  ctx.fillRect(0, 0, w, h);
  const count = 60;
  const spd = vcamSpeed * 0.015;
  for (let i = 0; i < count; i++) {
    const seed = i * 137.508;
    const px = ((Math.sin(seed) * 0.5 + 0.5) * w + time * spd * (i % 3 + 1) * 20) % w;
    const py = ((Math.cos(seed * 1.3) * 0.5 + 0.5) * h + time * spd * (i % 2 + 0.5) * 10) % h;
    const sz = 1.5 + (i % 4) * vcamDepth * 0.3;
    ctx.globalAlpha = 0.4 + Math.sin(time * 0.02 + i) * 0.3;
    ctx.fillStyle = i % 3 === 0 ? '#5DCAA5' : i % 3 === 1 ? '#534AB7' : '#AFA9EC';
    ctx.beginPath(); ctx.arc(px, py, sz, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawVCam(time) {
  const w = vcamCanvas.width, h = vcamCanvas.height;
  if (vcamScene === 'grid') drawGrid(vcCtx, w, h, time);
  else if (vcamScene === 'tunnel') drawTunnel(vcCtx, w, h, time);
  else drawParticles(vcCtx, w, h, time);
}

function drawComposite() {
  const w = compositeCanvas.width, h = compositeCanvas.height;
  compCtx.clearRect(0, 0, w, h);

  if (blendMode === 'side') {
    compCtx.drawImage(vcamCanvas, 0, 0, w/2, h);
    if (camStream) {
      compCtx.globalAlpha = 1;
      compCtx.drawImage(camVideo, w/2, 0, w/2, h);
    } else {
      compCtx.fillStyle = '#1a1a2e';
      compCtx.fillRect(w/2, 0, w/2, h);
      compCtx.fillStyle = '#534AB7';
      compCtx.font = '13px sans-serif';
      compCtx.textAlign = 'center';
      compCtx.fillText('camera off', w*0.75, h/2);
    }
  } else if (blendMode === 'overlay') {
    compCtx.drawImage(vcamCanvas, 0, 0, w, h);
    if (camStream) {
      compCtx.globalAlpha = camOpacity;
      compCtx.drawImage(camVideo, 0, 0, w, h);
      compCtx.globalAlpha = 1;
    }
  } else if (blendMode === 'pip') {
    compCtx.drawImage(vcamCanvas, 0, 0, w, h);
    if (camStream) {
      const pw = w * 0.35, ph = h * 0.35;
      const px = w - pw - 12, py = h - ph - 12;
      compCtx.save();
      compCtx.beginPath();
      compCtx.roundRect(px, py, pw, ph, 6);
      compCtx.clip();
      compCtx.drawImage(camVideo, px, py, pw, ph);
      compCtx.restore();
      compCtx.strokeStyle = '#534AB7';
      compCtx.lineWidth = 2;
      compCtx.beginPath();
      compCtx.roundRect(px, py, pw, ph, 6);
      compCtx.stroke();
    }
  }
}

function loop() {
  t++;
  drawVCam(t);
  drawComposite();
  animFrame = requestAnimationFrame(loop);
}
loop();

document.getElementById('start-cam').addEventListener('click', async () => {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    camVideo.srcObject = null;
    document.getElementById('cam-badge').textContent = 'NO CAM';
    document.getElementById('cam-dot').className = 'status-dot';
    document.getElementById('cam-status').textContent = 'camera off';
    document.getElementById('start-cam').textContent = 'start camera';
    document.getElementById('flip-cam').style.display = 'none';
    return;
  }
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true });
    camVideo.srcObject = camStream;
    document.getElementById('cam-badge').textContent = 'LIVE';
    document.getElementById('cam-dot').className = 'status-dot green';
    document.getElementById('cam-status').textContent = 'camera active';
    document.getElementById('start-cam').textContent = 'stop camera';
    document.getElementById('flip-cam').style.display = '';
  } catch(e) {
    document.getElementById('cam-status').textContent = 'permission denied';
  }
});

document.getElementById('flip-cam').addEventListener('click', async () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true });
    camVideo.srcObject = camStream;
  }
});

['grid','tunnel','particles'].forEach(scene => {
  document.getElementById('scene-' + scene).addEventListener('click', () => {
    vcamScene = scene;
    document.querySelectorAll('[id^=scene-]').forEach(b => b.classList.remove('active'));
    document.getElementById('scene-' + scene).classList.add('active');
  });
});

['side','overlay','pip'].forEach(mode => {
  document.getElementById('blend-' + mode).addEventListener('click', () => {
    blendMode = mode;
    document.querySelectorAll('[id^=blend-]').forEach(b => b.classList.remove('active'));
    document.getElementById('blend-' + mode).classList.add('active');
  });
});

document.getElementById('vcam-speed').addEventListener('input', e => {
  vcamSpeed = parseInt(e.target.value);
  document.getElementById('speed-val').textContent = vcamSpeed;
});
document.getElementById('vcam-depth').addEventListener('input', e => {
  vcamDepth = parseInt(e.target.value);
  document.getElementById('depth-val').textContent = vcamDepth;
});
document.getElementById('cam-opacity').addEventListener('input', e => {
  camOpacity = parseInt(e.target.value) / 100;
  document.getElementById('opacity-val').textContent = e.target.value + '%';
});

document.getElementById('rec-btn').addEventListener('click', () => {
  if (isRecording) return;
  recordedChunks = [];
  const stream = compositeCanvas.captureStream(30);
  if (camStream) {
    const audioTrack = camStream.getAudioTracks()[0];
    if (audioTrack) stream.addTrack(audioTrack);
  }
  mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.getElementById('download-link');
    a.href = url; a.download = 'vcam-recording.webm'; a.style.display = 'inline';
    a.click();
    a.style.display = 'none';
  };
  mediaRecorder.start();
  isRecording = true;
  recSeconds = 0;
  document.getElementById('rec-btn').disabled = true;
  document.getElementById('stop-btn').disabled = false;
  document.getElementById('rec-dot').className = 'status-dot red';
  document.getElementById('rec-status').textContent = 'recording...';
  document.getElementById('rec-badge').style.display = '';
  recInterval = setInterval(() => {
    recSeconds++;
    const m = Math.floor(recSeconds/60).toString().padStart(2,'0');
    const s = (recSeconds%60).toString().padStart(2,'0');
    document.getElementById('rec-time').textContent = m + ':' + s;
  }, 1000);
});

document.getElementById('stop-btn').addEventListener('click', () => {
  if (!isRecording) return;
  mediaRecorder.stop();
  isRecording = false;
  clearInterval(recInterval);
  document.getElementById('rec-btn').disabled = false;
  document.getElementById('stop-btn').disabled = true;
  document.getElementById('rec-dot').className = 'status-dot';
  document.getElementById('rec-status').textContent = 'saved — check downloads';
  document.getElementById('rec-badge').style.display = 'none';
  document.getElementById('rec-time').textContent = '';
});
</script>
